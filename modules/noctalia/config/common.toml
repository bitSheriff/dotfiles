# Shared noctalia settings - host-agnostic only. Pulled in via [include]
# from each modules/noctalia/config/hosts/<hostname>.toml (see
# modules/noctalia/default.nix). Do NOT put monitor/output-pinned settings
# here (wallpaper.monitors.*, lockscreen widget placement, per-monitor bar
# overrides, etc.) - those belong in the host-specific file since monitor
# connector names and screen geometry differ per machine.
#
# Theme (mode/source/custom_palette), the default wallpaper path, opacity,
# and font are owned by Stylix (see modules/stylix) via the Nix-generated
# ~/.config/noctalia/config.toml - don't duplicate those keys here either,
# unless a host deliberately wants to override Stylix's wallpaper choice
# (do that per-host, not here).

[calendar]
enabled = true

[control_center.calendar]
show_week_numbers = true

[dock]
enabled = true
icon_size = 32
reserve_space = false
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[shell]
polkit_agent = true
screen_time_enabled = true
