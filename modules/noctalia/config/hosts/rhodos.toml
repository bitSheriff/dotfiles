# rhodos (desktop, NVIDIA) - host-specific noctalia overrides. Shared/
# host-agnostic settings live in ../common.toml and are pulled in below.
# This file is symlinked live into ~/.config/noctalia/user.toml (see
# modules/noctalia/default.nix) - edit directly, no rebuild needed.

# Noctalia resolves [include] relative paths against the symlink hop it
# opened the file from (inside the nix store), not this file's real
# on-disk directory - so "../common.toml" silently fails to resolve.
# Use an absolute (or ~-based) path instead.
[include]
files = ["~/code/dotfiles/modules/noctalia/config/common.toml"]

# Add rhodos-specific overrides here once you know your monitor connector
# names, e.g.:
#   [wallpaper.monitors.DP-1]
#   path = "/home/benjamin/Pictures/wallpapers/..."
# Find connector names with: hyprctl monitors | grep Monitor
