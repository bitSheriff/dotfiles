# Termux configuration for the Android host.
# Linked to ~/.termux/termux.properties by setup.sh

# Extra keys row, without those a phone keyboard is unusable for nvim/fzf
extra-keys = [ \
 ['ESC','/','-','HOME','UP','END','PGUP'], \
 ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN'] \
]

# force char based input, some phone keyboards swallow keys otherwise
enforce-char-based-input = true

# no beeping, just ignore the bell character
bell-character = ignore

# a bit of breathing room around the terminal
terminal-margin-horizontal = 3
terminal-margin-vertical = 0
